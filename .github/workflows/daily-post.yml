name: Daily Telegram Post

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"
      timezone: "Asia/Tehran"
    - cron: "0 8 * * *"
      timezone: "Asia/Tehran"

jobs:
  send-evening:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send dot to im682
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=@im682" \
            --data-urlencode "text=."

  send-morning:
    if: github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send dot to Rlove0
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=@Rlove0" \
            --data-urlencode "text=."
